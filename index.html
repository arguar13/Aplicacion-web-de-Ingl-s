<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aprende vocabulario en inglés: escucha la palabra y pulsa la tecla con su traducción."
    />
    <meta name="theme-color" content="#f4f1ea" />
    <script>
      // Aplica el tema antes de pintar para evitar un destello del tema equivocado.
      try {
        var theme = (JSON.parse(localStorage.getItem('tecla:settings:v1')) || {}).theme
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tecla" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tecla · Vocabulario en inglés</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
