<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aprende las 3978 palabras más usadas del inglés: escúchalas, pulsa su traducción y repásalas justo antes de olvidarlas. Gratis y sin conexión."
    />
    <!-- Al compartir el enlace. La imagen y la URL canónica las añade vite/site-meta.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tecla" />
    <meta property="og:locale" content="es_LA" />
    <meta property="og:title" content="Tecla · Vocabulario en inglés" />
    <meta
      property="og:description"
      content="Escucha una palabra, pulsa su traducción y repásala justo antes de olvidarla. Pocos minutos al día."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f4f1ea" />
    <script>
      // Aplica el tema antes de pintar para evitar un destello del tema equivocado.
      try {
        var theme = (JSON.parse(localStorage.getItem('tecla:settings:v1')) || {}).theme
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tecla" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tecla · Vocabulario en inglés</title>
    <style>
      /* Pantalla de arranque: se pinta con el HTML, sin esperar a la app (en una red lenta, segundos
         antes). React la reemplaza al montarse. Colores iguales a --bg de index.css. */
      html {
        background: #f4f1ea;
      }
      html[data-theme='dark'] {
        background: #0f1013;
      }
      .arranque {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      .arranque svg {
        width: 56px;
        height: 56px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arranque" data-arranque role="status" aria-label="Cargando Tecla">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g transform="rotate(-6 32 32)">
            <rect x="4" y="8" width="56" height="52" rx="14" fill="#2f2a8f" />
            <rect x="4" y="4" width="56" height="50" rx="14" fill="#4338ca" />
            <text
              x="32"
              y="41"
              font-family="Georgia, serif"
              font-size="30"
              font-style="italic"
              fill="#fff"
              text-anchor="middle"
            >
              Aa
            </text>
          </g>
        </svg>
      </div>
    </div>
    <script>
      // Red de seguridad: un error al cargar los módulos ocurre antes de React (y de su pantalla de
      // error). Si la app no llegó a montarse (sigue la pantalla de arranque), se muestra un aviso en
      // vez de quedarse en el logo para siempre.
      window.addEventListener('error', function () {
        var root = document.getElementById('root')
        if (!root || !root.querySelector('[data-arranque]')) return
        root.innerHTML =
          '<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:var(--ink,#1c1a17)">' +
          '<div><p style="font-size:28px;margin:0 0 8px">Tecla no pudo arrancar</p>' +
          '<p style="margin:0 0 20px;color:var(--muted,#6a645a)">Tu progreso está a salvo en este dispositivo. Prueba a recargar.</p>' +
          '<button onclick="location.reload()" style="font:600 15px system-ui,sans-serif;padding:12px 24px;border-radius:999px;border:0;background:var(--accent,#4338ca);color:var(--accent-ink,#fff);cursor:pointer">Recargar</button></div></main>'
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
