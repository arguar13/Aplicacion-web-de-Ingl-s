# Despliegue a Hostinger por FTPS. Se activa solo cuando el dueño configura el repositorio
# (ver "Despliegue automático" en el README); mientras tanto se salta sin fallar.
# La carpeta de destino es obligatoria y se comprueba antes de subir: si contiene otro sitio
# (p. ej. un WordPress en public_html), el despliegue se cancela en lugar de pisarlo.
name: Despliegue

on:
  # Tras un CI en verde en main: se despliega exactamente el commit que pasó las pruebas.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A mano desde la pestaña Actions (p. ej. para volver a subir la versión actual).
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y subida a Hostinger
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Comprobar que la carpeta de destino no es de otro sitio
        id: destino
        run: bash scripts/check-deploy-target.sh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build con la dirección pública (URL canónica, sitemap, imagen para compartir)
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run budget
      - name: Subir dist/ a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ steps.destino.outputs.dir }}
          # Sube solo lo que cambió (guarda su estado en el servidor) y nunca borra la carpeta
          # entera: los audios (~22 MB) solo se suben la primera vez.
          dangerous-clean-slate: false
